name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Keep in sync with rust-toolchain.toml — a floating channel
        # plus -D warnings breaks CI on every Rust release.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest
        run: cargo nextest run --workspace --target ${{ matrix.target }}

      - name: cargo build (release)
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: rt-audit (release)
        run: cargo run --release -p rt-audit --target ${{ matrix.target }}

  rt-audit-debug:
    name: RT-audit (debug)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: rt-audit (debug)
        run: cargo run -p rt-audit

  docs-check:
    name: Docs in sync with code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-docs
        run: ./scripts/check-docs.sh

  deny:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      # Licences, bans and sources only. Advisories are `make audit`:
      # they need the advisory database and an upstream publication
      # would fail this job for reasons unrelated to the change.
      - name: cargo deny
        run: cargo deny check licenses bans sources
