[package]
name = "dub-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FFI surface exposing dub-engine to Swift via UniFFI."

# We export three crate types from the same crate:
# * `lib` — so Rust workspace consumers (tests, dub-cli) can still link
#   against the crate. Required for `cargo test`.
# * `staticlib` — produces `libdub_ffi.a`, which `scripts/build-xcframework.sh`
#   wraps into `DubCore.xcframework` for the Apple shell to consume.
# * `cdylib` — produces `libdub_ffi.dylib`, used for UniFFI's "library mode"
#   binding generation (faster than scaffolding via a UDL file because the
#   dylib carries the type registry).
[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "dub_ffi"

# Bindgen binary. Invoked by `scripts/build-xcframework.sh` to generate the
# Swift bindings from the same metadata that the `#[uniffi::export]` macros
# in `src/lib.rs` emit. Gated behind a feature so library consumers don't
# pull in the `clap` dependency that UniFFI's CLI uses.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[features]
default = []
# Enable UniFFI's CLI surface (drag in `clap`). Used only when building the
# `uniffi-bindgen` binary.
uniffi-cli = ["uniffi/cli"]

[dependencies]
dub-engine = { workspace = true }
# M15 — the echo-out FFI resolves the feedback low-pass coefficient off-RT
# (`one_pole_coeff`) before handing it to the engine.
dub-dsp = { workspace = true }
dub-audio = { workspace = true }
dub-bpm = { workspace = true }
dub-io = { workspace = true }
dub-peaks = { workspace = true }
dub-library = { workspace = true }
dub-fingerprint = { workspace = true }
# M26a — the vinyl-rip FFI surface (`src/rip.rs`) wraps `dub_rip::RipSession`.
dub-rip = { workspace = true }
# M26c — recognition, run on a background worker like the commit job.
# The only crate in the workspace that reaches the network.
dub-recognize = { workspace = true }
# M26a — the record-tap consumer handed from `start_thru_for_rip` to
# `create_rip_session` is a `ringbuf::HeapCons<f32>`.
ringbuf = { workspace = true }
# M26a — default rip destination is `~/Music/Dub/Rips/<timestamp>`.
dirs = { workspace = true }
uniffi = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Tempdirs for the library-FFI smoke tests so they don't pollute the
# developer's real `~/Library/Application Support/Dub/library.sqlite`.
tempfile = "3"
